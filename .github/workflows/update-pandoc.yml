name: Update pandoc

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Check for a new pandoc release
        id: check
        run: |
          latest=$(curl -sL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/jgm/pandoc/releases/latest | jq -r .tag_name)
          current=$(cat version.txt)

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "up-to-date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up-to-date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version.txt and hashes.json
        if: steps.check.outputs.up-to-date == 'false'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          echo "$LATEST" > version.txt

          suffixes=$(nix eval --json .#lib.platformAssetSuffixes)
          new_hashes="{}"
          for platform in $(echo "$suffixes" | jq -r 'keys[]'); do
            suffix=$(echo "$suffixes" | jq -r --arg p "$platform" '.[$p]')
            url="https://github.com/jgm/pandoc/releases/download/${LATEST}/pandoc-${LATEST}-${suffix}"
            base32=$(nix-prefetch-url --unpack --type sha256 "$url")
            sri=$(nix hash convert --to sri --hash-algo sha256 "$base32")
            new_hashes=$(echo "$new_hashes" | jq --arg p "$platform" --arg h "$sri" '.[$p] = $h')
          done
          echo "$new_hashes" | jq --sort-keys . > hashes.json

      - name: Build to verify the update
        if: steps.check.outputs.up-to-date == 'false'
        run: nix build .#packages.x86_64-linux.default -L

      - name: Commit and push
        if: steps.check.outputs.up-to-date == 'false'
        env:
          OLDER: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt hashes.json
          git commit -m "pandoc: ${OLDER} -> ${LATEST}"
          git push
