name: Update flake inputs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Update flake inputs
        id: update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          before=$(git rev-parse HEAD)
          nix flake update --commit-lock-file
          after=$(git rev-parse HEAD)

          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # --no-build: this runner can only build for x86_64-linux (no darwin
      # builder, and Darwin can't be cross-built from Linux at all), so this
      # just catches evaluation/type errors across all four systems.
      - name: Check flake (all systems, evaluation only)
        if: steps.update.outputs.changed == 'true'
        run: nix flake check --all-systems --no-build -L

      - name: Build to verify the update
        if: steps.update.outputs.changed == 'true'
        run: nix build .#packages.x86_64-linux.default -L

      - name: Push
        if: steps.update.outputs.changed == 'true'
        run: git push
